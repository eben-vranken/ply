[package]
name = "ply-optimizer"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "FSRS weight optimisation for Ply: fsrs-rs compiled to single-threaded WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# FSRS-6, the 21 weights ts-fsrs 5 schedules with. BSD-3-Clause.
fsrs = "=6.6.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
