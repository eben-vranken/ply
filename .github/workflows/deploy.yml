name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            pipeline
            optimizer
      - run: cargo test --release
        working-directory: pipeline
      # the FSRS optimiser shipped as app/public/fsrs/ply_optimizer.wasm (npm run optimizer rebuilds it)
      - run: cargo test --release
        working-directory: optimizer
  app:
    # Playwright 1.56 (the smoke test) supports Ubuntu up to 24.04; ubuntu-latest is now 26.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run check
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      # the smoke test plays a session in headless Chromium against the built app
      - run: npx playwright install --with-deps chromium webkit
        working-directory: app
      - run: mkdir -p smoke-shots && npm run smoke
        working-directory: app
        env:
          SHOTS: smoke-shots
      # the same session in WebKit, Safari's engine, as an iPhone
      - run: mkdir -p smoke-shots/iphone && npm run smoke
        working-directory: app
        env:
          SHOTS: smoke-shots/iphone
          BROWSER: webkit
          DEVICE: iphone
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-screenshots
          path: app/smoke-shots
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: app/dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [pipeline, app]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
