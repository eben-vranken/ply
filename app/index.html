<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ECEEF3" />
    <link rel="icon" href="/ply/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/ply/icon-192.png" />
    <title>Ply</title>
    <script>
      // set the theme before first paint so there is no light flash
      try {
        var t = (JSON.parse(localStorage.getItem('ply-state-v1') || '{}').theme) || 'auto';
        document.documentElement.dataset.theme = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
